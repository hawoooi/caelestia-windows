format = """$directory$git_branch$git_status$time$character"""

[directory]
style = "bg:#1a2121 fg:#80d4d9"
format = "[ $path ]($style)"
truncation_length = 0
truncate_to_repo = false

[git_branch]
symbol = "\uF418 "
style = "fg:#bec8c9"
format = '[$symbol$branch ]($style)'

[git_status]
style = "fg:#899393"
format = '[($all_status$ahead_behind )]($style)'

[time]
disabled = false
time_format = "%R"
style = "fg:#899393"
format = '[  $time]($style)'

[character]
success_symbol = "[ \u276F](bold fg:#80d4d9)"
error_symbol = "[ \u276F](bold fg:#ffb4ab)"

[line_break]
disabled = true

[cmd_duration]
min_time = 2000
format = "took $duration "
style = "fg:#899393"
