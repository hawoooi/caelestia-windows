format = """
[](#ffb4ab)\
$os\
$username\
[█](bg:#ffb3ad fg:#ffb4ab)\
$directory\
[](bg:#e1c28c fg:#ffb3ad)\
$git_branch\
$git_status\
[](fg:#e1c28c bg:#e7bdb9)\
$c\
$rust\
$golang\
$nodejs\
$php\
$java\
$kotlin\
$haskell\
$python\
[](fg:#e7bdb9 bg:#ffdad7)\
$conda\
[](fg:#ffdad7 bg:#ffdea6)\
$time\
[ ](fg:#ffdea6)\
$cmd_duration\
$line_break\
$character"""

[os]
disabled = false
style = "bg:#ffb4ab fg:#690005"

[os.symbols]
Windows = ""
Ubuntu = "󰕈"
SUSE = ""
Raspbian = "󰐿"
Mint = "󰣭"
Macos = "󰀵"
Manjaro = ""
Linux = "󰌽"
Gentoo = "󰣨"
Fedora = "󰣛"
Alpine = ""
Amazon = ""
Android = ""
Arch = "󰣇"
Artix = "󰣇"
CentOS = ""
Debian = "󰣚"
Redhat = "󱄛"
RedHatEnterprise = "󱄛"

[username]
show_always = true
style_user = "bg:#ffb4ab fg:#690005"
style_root = "bg:#ffb4ab fg:#690005"
format = '[ $user]($style)'

[directory]
style = "bg:#ffb3ad fg:#571e1b"
format = "[ $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"

[directory.substitutions]
"Documents" = " "
"Downloads" = " "
"Music" = "󰝚 "
"Pictures" = " "
"Developer" = "󰲋 "

[git_branch]
symbol = ""
style = "bg:#e1c28c"
format = '[[ $symbol $branch ](fg:#402d04 bg:#e1c28c)]($style)'

[git_status]
style = "bg:#e1c28c"
format = '[[($all_status$ahead_behind )](fg:#402d04 bg:#e1c28c)]($style)'

[nodejs]
symbol = ""
style = "bg:#e7bdb9"
format = '[[ $symbol( $version) ](fg:#442927 bg:#e7bdb9)]($style)'

[c]
symbol = " "
style = "bg:#e7bdb9"
format = '[[ $symbol( $version) ](fg:#442927 bg:#e7bdb9)]($style)'

[rust]
symbol = ""
style = "bg:#e7bdb9"
format = '[[ $symbol( $version) ](fg:#442927 bg:#e7bdb9)]($style)'

[golang]
symbol = ""
style = "bg:#e7bdb9"
format = '[[ $symbol( $version) ](fg:#442927 bg:#e7bdb9)]($style)'

[php]
symbol = ""
style = "bg:#e7bdb9"
format = '[[ $symbol( $version) ](fg:#442927 bg:#e7bdb9)]($style)'

[java]
symbol = " "
style = "bg:#e7bdb9"
format = '[[ $symbol( $version) ](fg:#442927 bg:#e7bdb9)]($style)'

[kotlin]
symbol = ""
style = "bg:#e7bdb9"
format = '[[ $symbol( $version) ](fg:#442927 bg:#e7bdb9)]($style)'

[haskell]
symbol = ""
style = "bg:#e7bdb9"
format = '[[ $symbol( $version) ](fg:#442927 bg:#e7bdb9)]($style)'

[python]
symbol = ""
style = "bg:#e7bdb9"
format = '[[ $symbol( $version)(\(#$virtualenv\)) ](fg:#442927 bg:#e7bdb9)]($style)'

[docker_context]
symbol = ""
style = "bg:#ffdad7"
format = '[[ $symbol( $context) ](fg:#3b0909 bg:#ffdad7)]($style)'

[conda]
symbol = "  "
style = "fg:#3b0909 bg:#ffdad7"
format = '[$symbol$environment ]($style)'
ignore_base = false

[time]
disabled = false
time_format = "%R"
style = "bg:#ffdea6"
format = '[[  $time ](fg:#271900 bg:#ffdea6)]($style)'

[line_break]
disabled = true

[character]
disabled = false
success_symbol = '[❯](bold fg:#e7bdb9)'
error_symbol = '[❯](bold fg:#ffb4ab)'
vimcmd_symbol = '[❮](bold fg:#e7bdb9)'
vimcmd_replace_one_symbol = '[❮](bold fg:#ffdea6)'
vimcmd_replace_symbol = '[❮](bold fg:#ffdea6)'
vimcmd_visual_symbol = '[❮](bold fg:#e1c28c)'

[cmd_duration]
show_milliseconds = true
format = " in $duration "
style = "bg:#ffdea6"
disabled = false
show_notifications = true
min_time_to_notify = 45000
