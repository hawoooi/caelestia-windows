# starship prompt -- agnoster, in this wallpaper's palette.
#
# Chosen from ten printed candidates (scripts/Show-PromptCandidates.ps1); this
# is the "10-agnoster-themed" one, ported here so it follows the wallpaper. The
# preview configs under state/prompt-candidates/ have the palette baked in as
# literal hex and must never be installed -- a literal palette stops
# re-theming. This file is the only version that does.
#
# ---------------------------------------------------------------------------
# CORRECTION: POWERLINE SEPARATORS WORK. The previous version of this file
# argued at length that they could not, on the grounds that ~/.wezterm.lua's
# `cell_width = 0.9` squeezes U+E0B0 into a doubled-chevron artifact, and that
# the only fix was cell_width = 1.0. THAT WAS INFERRED AND NEVER TESTED, and it
# is wrong. Tested by rendering this design in a real WezTerm at the live
# setting and zooming in: the separators are clean solid triangles, no doubling
# and no seam. The artifact belonged to a DIFFERENT glyph -- the catppuccin
# preset also uses the ROUND caps U+E0B4/U+E0B6, a different shape with a
# different cell fit. cell_width does not need changing.
# ---------------------------------------------------------------------------
#
# THE ONE RULE THIS FILE FOLLOWS: every arrow is drawn by a module that knows
# BOTH blocks it sits between, because an arrow is coloured
# `fg = block on its left, bg = block on its right`. A closing arrow placed in
# [character] is a guess -- starship has no conditional styling and no way to
# ask whether a module rendered, so [character] cannot know which block came
# last, and the arrow comes out mismatched against the block it touches. That
# is why git_branch (the last block inside a repo) owns the closing arrow, and
# why [character] draws nothing at all. If you re-enable a module that renders
# AFTER git_branch, the closing arrow must move onto it.
#
# Verify a change by dumping the raw SGR escapes and checking the pair
# preceding each U+E0B0, not by eye:
#   $env:STARSHIP_CONFIG = "$env:USERPROFILE\.config\starship.toml"
#   starship prompt --status=0 | Format-Hex
#
# EVERY GLYPH IS A \uXXXX ESCAPE, DELIBERATELY. An earlier version pasted them
# in raw and every character in the BMP private-use area (U+E000-U+F8FF) was
# silently stripped -- separators became empty `[]` and icons vanished. An
# escape is plain ASCII and cannot be lost that way. TOML detail that forces
# it: BASIC strings ("..." and """...""") support \uXXXX, LITERAL strings
# ('...') do not -- in a literal string the backslash reaches starship's own
# format parser raw and is rejected with "expected escaped_char".
#
# Codepoints are chosen for `CartographCF Nerd Font`, a Nerd Fonts **v2**
# build. Each was verified present by rendering it and comparing its ink
# against a deliberately-unassigned codepoint, so a .notdef fallback would be
# caught rather than assumed.

# The leading block is a GHOST, matching the left bar's own logo, in place of
# agnoster's user@host. Direct user request.
#
# NOT the bar's codepoint. The bar uses Font Awesome Free 6 Solid's U+F6E2
# (bar/entries/logo.js); that codepoint IS in this font's cmap, where it draws
# the DROPBOX logo, because it falls inside Nerd Fonts v2's Material Design
# block. The real ghost is U+F79F (nf-mdi-ghost).
#
# It is literal styled text rather than a module because no starship module
# renders a constant. The arrow out of it is drawn here for the usual reason.
#
# Cost of the simplification, stated rather than hidden: agnoster shows the
# user in red when root, via [username]'s style_root. With that module gone
# there is no root indicator at all.
format = """[ \uF79F ](bg:{{colors.surface_container_highest.default.hex}} fg:{{colors.on_surface.default.hex}})\
[\uE0B0](fg:{{colors.surface_container_highest.default.hex}} bg:{{colors.primary.default.hex}})\
$directory\
$git_branch\
$cmd_duration\
$character"""

[directory]
# Colours are a Material ROLE PAIR, not a computed tone. The preview derived
# each block's text by dropping its own background to 11% lightness; here
# `on_primary` is the counterpart Material already designs for exactly this --
# text on a primary-filled surface -- so contrast is guaranteed by construction
# and survives any wallpaper, which a hand-computed lightness would not.
style = "bg:{{colors.primary.default.hex}} fg:{{colors.on_primary.default.hex}}"
format = "[ $path ]($style)"
# The FULL path. Standing user instruction ("print the full path"), and it is
# also what real agnoster does -- its prompt_dir is `%~`, the whole path with ~
# abbreviation, NOT a truncation. The candidate preview showed `…\setup` only
# because the preview set truncation_length = 3; that was a deviation, not
# agnoster. To go back to three components: truncation_length = 3 and
# truncation_symbol = "…/".
truncation_length = 0
truncate_to_repo = false
home_symbol = "~"

# NO [directory.substitutions] -- direct user feedback, "no icons on the path".

[git_branch]
# Owns the CLOSING ARROW, because with git_status disabled this is the last
# block inside a repo. See the rule at the top of this file before moving it.
symbol = "\uF418"
style = "bg:{{colors.tertiary.default.hex}} fg:{{colors.on_tertiary.default.hex}}"
format = "[\uE0B0](fg:{{colors.primary.default.hex}} bg:{{colors.tertiary.default.hex}})[ $symbol $branch ]($style)[\uE0B0](fg:{{colors.tertiary.default.hex}})"

[git_status]
# OFF by direct request -- "remove those marks". It showed, in order: tracked
# files with unstaged edits (!), untracked files (?), and commits ahead of the
# remote (arrow + count).
#
# To bring it back: set disabled = false, MOVE the closing arrow off
# git_branch's format above onto the end of this one, and restore
#   style  = "bg:{{colors.tertiary.default.hex}} fg:{{colors.on_tertiary.default.hex}}"
#   format = "[ $all_status$ahead_behind ]($style)[\uE0B0](fg:{{colors.tertiary.default.hex}})"
#   ahead / behind / diverged = the SOLID arrows U+2191 / U+2193 / U+2195.
# Never starship's dashed U+21E1/U+21E3 defaults: measured at ~54px of ink
# against ~107px for the solid ones and ~71px for a plain "?", they read as
# broken glyphs at terminal size rather than as arrows.
disabled = true

[character]
# Draws NOTHING. The prompt already ends in git_branch's closing arrow, and an
# arrow here could not know which block preceded it. See the rule at the top.
success_symbol = ""
error_symbol = ""

[cmd_duration]
# Plain text after the closing arrow, so it never participates in the powerline
# chain and can appear or vanish without leaving a mismatched separator.
min_time = 2000
format = " took $duration"
style = "fg:{{colors.outline.default.hex}}"
disabled = false
show_notifications = true
min_time_to_notify = 45000

[line_break]
disabled = true
