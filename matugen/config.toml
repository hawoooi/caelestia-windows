[config]

# yasb and tacky-borders templates were unwired from the pipeline when yasb
# was retired in favour of the Zebar bar and komorebi's own window borders
# (see CLAUDE.md's "The stack" table and "Window borders and gaps" section --
# there is no separate docs/borders-yasb.md; CLAUDE.md itself is where this
# is documented). The template files themselves
# (matugen/templates/yasb.styles.css, matugen/templates/tacky-borders.yaml)
# are kept on disk, unreferenced here, so the work is recoverable -- just not
# rendered by matugen anymore.

[templates.wezterm]
input_path = 'C:\Users\PC\Documents\git\setup\matugen\templates\palette.lua'
output_path = 'C:\Users\PC\Documents\git\setup\state\staging\palette.lua'

[templates.starship]
input_path = 'C:\Users\PC\Documents\git\setup\matugen\templates\starship.toml'
output_path = 'C:\Users\PC\Documents\git\setup\state\staging\starship.toml'

# A cava colour theme, NOT a cava config -- cava's `[color] theme = '<name>'`
# key loads a small colour-only file from ~/.config/cava/themes/<name>, which
# is how this pipeline stays out of the 13 KB config where sensitivity, bar
# count, output mode and shader choice live. That file is hand-owned; only
# `theme = 'wallpaper'` in it points here.
[templates.cava]
input_path = 'C:\Users\PC\Documents\git\setup\matugen\templates\cava.theme'
output_path = 'C:\Users\PC\Documents\git\setup\state\staging\cava.theme'

[templates.zebar]
input_path = 'C:\Users\PC\Documents\git\setup\matugen\templates\zebar.theme.css'
output_path = 'C:\Users\PC\Documents\git\setup\state\staging\theme.css'

# NOT one of $script:Targets in Apply-Theme.ps1 -- this has no live config of
# its own to copy/validate/roll back. It only exists so Apply-Theme's
# border-colour step (Update-KomorebiBorderTheme) has hex values to read
# after matugen's single render pass, instead of needing a second matugen
# invocation just to dump colours.
[templates.komorebi]
input_path = 'C:\Users\PC\Documents\git\setup\matugen\templates\komorebi-colours.json'
output_path = 'C:\Users\PC\Documents\git\setup\state\staging\komorebi-colours.json'

# Also NOT one of $script:Targets, for the same reason as [templates.komorebi]
# above: there is no live config FILE to copy or roll back. Windows' accent
# colours live in the registry, so Apply-Theme's Update-WindowsAccentTheme
# step reads these hex values and writes HKCU keys instead -- with the previous
# values snapshotted into state/pre-apply/ first, since a registry write has no
# equivalent of "copy the old file back".
[templates.windows]
input_path = 'C:\Users\PC\Documents\git\setup\matugen\templates\windows-accent.json'
output_path = 'C:\Users\PC\Documents\git\setup\state\staging\windows-accent.json'

# Also NOT one of $script:Targets, for the same reason as the two above: there
# is no single live config FILE to copy or roll back. foobar2000's colours are
# baked into the panel scripts at DEPLOY time -- Apply-Theme's
# Update-FoobarTheme step hands this staged palette to Deploy-Panels.ps1, which
# renders it to theme.js (ARGB integers, since GdiGraphics takes no strings) and
# theme.css, concatenates each panel with it and writes the result into the
# DUPLICATE install's profile. The panels themselves contain zero colour
# literals, which is what makes eight values enough.
[templates.foobar]
input_path = 'C:\Users\PC\Documents\git\setup\matugen\templates\foobar-palette.json'
output_path = 'C:\Users\PC\Documents\git\setup\state\staging\foobar-palette.json'
